<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="h-gj 的公开货架：Chrome 扩展、个人站点与可分享的 Agent Skills">
  <title>hgjhub</title>
  <link rel="stylesheet" href="css/style.css?v=7">
  <link rel="icon" href="assets/icons/vault-pass.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a class="logo" href="./">
          <span class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
          </span>
          <span id="site-title">hgjhub</span>
        </a>
        <nav class="header-nav">
          <a href="./#extensions">扩展</a>
          <a href="./#sites">站点</a>
          <a href="./#skills">Skills</a>
          <a href="install.html">指南</a>
          <a id="github-link" href="https://github.com/h-gj" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="hero-badge" id="hero-badge">扩展 · 站点 · Skills</p>
        <h1 id="hero-title">hgjhub</h1>
        <p class="hero-subtitle" id="hero-subtitle">Chrome 扩展、个人站点与可分享的 Agent Skills。</p>
      </div>
    </section>

    <section class="extensions-section" id="catalog">
      <div class="container">
        <div class="section-head">
          <div class="catalog-tabs" role="tablist" aria-label="目录">
            <button type="button" class="catalog-tab" role="tab" id="tab-extensions" data-tab="extensions" aria-controls="home-catalog-grid" aria-selected="true">扩展</button>
            <button type="button" class="catalog-tab" role="tab" id="tab-sites" data-tab="sites" aria-controls="home-catalog-grid" aria-selected="false">站点</button>
            <button type="button" class="catalog-tab" role="tab" id="tab-skills" data-tab="skills" aria-controls="home-catalog-grid" aria-selected="false">Skills</button>
          </div>
          <p id="catalog-count">加载中…</p>
        </div>
        <p class="section-note" id="note-sites" hidden>标有「学习复刻」的站点是非官方学习件，与原站作者无关。</p>
        <p class="section-note" id="note-skills" hidden>下载 zip 后解压到 <code>~/.cursor/skills/&lt;name&gt;/</code>。详见<a href="install.html#skills">安装指南</a>。</p>
        <div class="extensions-grid" id="home-catalog-grid" role="tabpanel" aria-labelledby="tab-extensions" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> <a id="footer-github" href="https://github.com/h-gj" target="_blank" rel="noopener">h-gj</a> · 纯静态站点，托管于 GitHub Pages</p>
    </div>
  </footer>

  <script src="js/shared.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
